<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dirt Rally</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#161b28;--hot:#ff7a1a;--si:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#9fcdf0;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%}
.box{position:fixed;background:var(--ink);border-radius:4px;box-shadow:0 2px 0 #0006}
#top{top:calc(var(--si) + 6px);left:50%;transform:translateX(-50%);text-align:center;padding:4px 20px 6px;border-top:3px solid var(--hot)}
#tm{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#gt{font-size:11px;letter-spacing:.08em;color:#cbd2e0}
#pace{position:fixed;top:calc(var(--si) + 66px);left:50%;margin-left:-36px;background:rgba(30,60,100,.45)}
#split{top:calc(var(--si) + 114px);left:50%;transform:translateX(-50%);background:var(--hot);padding:1px 8px;font-size:14px;font-weight:700;display:none}
#bl{left:10px;bottom:calc(var(--sb) + 10px);width:112px;padding:6px 8px}
#mi{font-size:20px;font-weight:700}#mi small,#sp+small{font-size:9px;color:#aab}
.r{display:flex;align-items:center;gap:4px;font-size:8px;color:#aab;margin-top:3px}.r span{width:34px}
.r i{flex:1;height:5px;background:#2a3040;position:relative;overflow:hidden}.r i b{position:absolute;left:0;top:0;bottom:0;background:#4ade80;width:var(--v,0%)}
.r i b.m{width:6px;background:#fff;left:calc(var(--v) - 3px)}
#br{right:10px;bottom:calc(var(--sb) + 10px);background:none;box-shadow:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tags{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.tags i{font-style:normal;font-size:9px;background:var(--ink);padding:1px 6px;opacity:.45;border-radius:2px}.tags i.on{opacity:1;background:#c33}
.row{display:flex;align-items:flex-end;gap:6px}
#gw{position:relative;width:56px;height:56px}
#rpm{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 225deg,var(--hot) calc(var(--p,0)*270deg),#2a3040 0 270deg,transparent 0);-webkit-mask:radial-gradient(circle,#0000 58%,#000 60%);mask:radial-gradient(circle,#0000 58%,#000 60%)}
#gr{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700}
#sbox{background:var(--ink);width:70px;height:56px;border-radius:4px;text-align:center;box-shadow:0 2px 0 #0006}
#sp{font-size:38px;font-weight:700;line-height:50px;display:block;height:46px}#sbox small{font-size:9px;color:#aab}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(10,14,25,.35);text-shadow:0 2px 6px #000a;padding:20px}
#ov h1{margin:0;font-size:52px;letter-spacing:.04em}#ov p{margin:0;font-size:20px;color:#e8edf5}
#tc{display:none;position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 112px);justify-content:space-between}
#tc div{display:flex;gap:8px}
.tb{width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:rgba(22,27,40,.6);color:#fff;font:700 14px "Barlow Condensed",sans-serif;touch-action:none}
.tb.g{background:rgba(255,122,26,.75)}
@media(pointer:coarse){#tc{display:flex}}
</style></head><body>
<canvas id="gl"></canvas>
<div id="top" class="box"><div id="tm">0:00.000</div><div id="gt">GATE 1 OF 20</div></div>
<canvas id="pace" width="72" height="44"></canvas>
<div id="split" class="box"></div>
<div id="bl" class="box"><div id="mi">0.00 <small>MI</small></div>
<div class="r"><span>STEER</span><i><b class="m" id="bs"></b></i></div>
<div class="r"><span>THROTTLE</span><i><b id="bt"></b></i></div>
<div class="r"><span>BRAKE</span><i><b id="bb" style="background:#f97316"></b></i></div></div>
<div id="br" class="box"><div class="tags"><i id="thb">HANDBRAKE</i><i id="tcl">CLUTCH</i></div>
<div class="row"><div id="gw"><div id="rpm"></div><div id="gr">1</div></div><div id="sbox"><span id="sp">0</span><small>MPH</small></div></div></div>
<div id="tc"><div><button class="tb" data-k="ArrowLeft">◀</button><button class="tb" data-k="ArrowRight">▶</button></div>
<div><button class="tb" data-k="Space">HB</button><button class="tb" data-k="ArrowDown">BRK</button><button class="tb g" data-k="ArrowUp">GAS</button></div></div>
<div id="ov"><h1>DIRT RALLY</h1><p>Hit the gas to start · 20 gates, beat the clock</p><p style="font-size:15px;color:#cbd2e0">↑ gas · ↓ brake · ← → steer · Space handbrake (drift) · R restart</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),K={};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyR')reset();if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{K[k]=1;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>K[k]=0});
// ---------- renderer / scene
const R=new T.WebGLRenderer({canvas:$('gl'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(65,1,.5,2000);
scene.fog=new T.Fog(0xbfdcf0,70,280);
scene.add(new T.HemisphereLight(0xcfe8ff,0x5a7a3a,.95));
const sun=new T.DirectionalLight(0xfff0d0,.9);sun.position.set(50,80,30);scene.add(sun);
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const sky=new T.Mesh(new T.SphereGeometry(900,16,8),new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false}));
{const p=sky.geometry.attributes.position,c=[];for(let i=0;i<p.count;i++){const k=new T.Color(0xbfdcf0).lerp(new T.Color(0x3f8fe0),Math.pow(Math.max(0,p.getY(i)/900),.6));c.push(k.r,k.g,k.b)}
sky.geometry.setAttribute('color',new T.Float32BufferAttribute(c,3))}
const sunB=new T.Mesh(new T.SphereGeometry(35,12,8),new T.MeshBasicMaterial({color:0xfff6d8,fog:false}));scene.add(sky,sunB);
const mat=c=>new T.MeshLambertMaterial({color:c,flatShading:true}),box=(w,h,d)=>new T.BoxGeometry(w,h,d);
// ---------- track
const N=1100,STEP=4,RW=5,GS=50,P=[];
{let x=0,z=0,h=0;for(let i=0;i<N;i++){const s=i*STEP;P.push({x,y:Math.sin(s/210)*5+Math.sin(s/90+1)*1.6,z,h});
h+=STEP*Math.min(1,s/250)*(.006*Math.sin(s/150)+.005*Math.sin(s/55+1.3)+.003*Math.sin(s/310+2));x+=Math.sin(h)*STEP;z+=Math.cos(h)*STEP}}
function ribbon(hw,dy,c1,c2){const pos=[],col=[],ix=[];
for(let i=0;i<N;i++){const p=P[i],nx=Math.cos(p.h),nz=-Math.sin(p.h),c=(i>>2)&1?c1:c2;
pos.push(p.x+nx*hw,p.y+dy,p.z+nz*hw,p.x-nx*hw,p.y+dy,p.z-nz*hw);col.push(c.r,c.g,c.b,c.r,c.g,c.b);
if(i<N-1){const a=2*i;ix.push(a,a+1,a+2,a+1,a+3,a+2)}}
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setIndex(ix);g.computeVertexNormals();
scene.add(new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide})))}
ribbon(70,-.15,new T.Color(0x70a03c),new T.Color(0x669232));
ribbon(RW,0,new T.Color(0xcba576),new T.Color(0xc29c6c));
// gates
for(let k=1;k<=20;k++){const p=P[k*GS],g=new T.Group(),w=RW+1,c=k==20?0xffffff:0xff7a1a;
[-1,1].forEach(s=>{const m=new T.Mesh(box(.5,6,.5),mat(c));m.position.set(s*w,3,0);g.add(m)});
const b=new T.Mesh(box(2*w+.5,1,.4),mat(c));b.position.y=6.2;g.add(b);
g.position.set(p.x,p.y,p.z);g.rotation.y=p.h;scene.add(g)}
// trees
{let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647,pines=[],decs=[];
for(let i=6;i<N-4;i++)for(const sd of[-1,1])if(rnd()<.35){const p=P[i],o=sd*(8+rnd()*38),a=p.h;
(rnd()<.7?pines:decs).push([p.x+Math.cos(a)*o,p.y-.15,p.z-Math.sin(a)*o,.8+rnd()*.9,rnd()])}
const all=pines.concat(decs),d=new T.Object3D(),col=new T.Color();
const trunk=new T.InstancedMesh(new T.CylinderGeometry(.35,.45,2,5),mat(0x5b4030),all.length);
const cone=new T.InstancedMesh(new T.ConeGeometry(2.3,5,6),mat(0xffffff),pines.length*2);
const ico=new T.InstancedMesh(new T.IcosahedronGeometry(2.5,0),mat(0xffffff),decs.length);
const put=(m,i,x,y,z,s,sx)=>{d.position.set(x,y,z);d.scale.setScalar(s);d.rotation.y=sx*6;d.updateMatrix();m.setMatrixAt(i,d.matrix)};
all.forEach((t,i)=>put(trunk,i,t[0],t[1]+t[3],t[2],t[3],t[4]));
pines.forEach((t,i)=>{put(cone,2*i,t[0],t[1]+3.3*t[3],t[2],t[3],t[4]);put(cone,2*i+1,t[0],t[1]+5.2*t[3],t[2],t[3]*.7,t[4]);
cone.setColorAt(2*i,col.setHSL(.33+t[4]*.04,.38,.17+t[4]*.07));cone.setColorAt(2*i+1,col)});
decs.forEach((t,i)=>{put(ico,i,t[0],t[1]+4*t[3],t[2],t[3],t[4]);ico.setColorAt(i,col.setHSL(.25+t[4]*.1,.4,.22+t[4]*.1))});
scene.add(trunk,cone,ico)}
// skid marks
const MK=800,marks=new T.InstancedMesh(new T.PlaneGeometry(.35,1.3),new T.MeshBasicMaterial({color:0x2a2018,transparent:true,opacity:.35,depthWrite:false}),MK);
{const z=new T.Matrix4().makeScale(0,0,0);for(let i=0;i<MK;i++)marks.setMatrixAt(i,z)}marks.frustumCulled=false;scene.add(marks);let mi=0;
// car
const car=new T.Group();car.rotation.order='YXZ';scene.add(car);
const part=(g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);car.add(o);return o};
const red=mat(0xd02323),dark=mat(0x1b2230),tail=new T.MeshBasicMaterial({color:0x661111});
part(box(2,.7,4.3),red,0,.7,0);part(box(1.7,.6,2.1),dark,0,1.3,-.2);part(box(1.7,.12,1.8),red,0,1.63,-.2);part(box(2.1,.1,.55),dark,0,1.75,-1.95);
part(box(.55,.22,.1),tail,-.7,.88,-2.17);part(box(.55,.22,.1),tail,.7,.88,-2.17);part(box(.9,.22,.05),mat(0xffffff),0,.6,-2.18);
const wg=new T.CylinderGeometry(.4,.4,.35,10).rotateZ(Math.PI/2),wm=mat(0x111111);
[[-1,1.4],[1,1.4],[-1,-1.4],[1,-1.4]].forEach(([x,z])=>part(wg,wm,x,.4,z));
{const s=new T.Mesh(new T.PlaneGeometry(2.8,5.2),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.3,depthWrite:false}));s.rotation.x=-Math.PI/2;s.position.y=.04;car.add(s)}
// ---------- game state
let px,pz,psi,vx,vz,idx,gate,state,steerC,clock,dist,acc,camA,gy,best=null,gear=1,clT=0,spT=0;
const fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0');
function reset(){const a=P[3];px=a.x;pz=a.z;psi=camA=a.h;vx=vz=0;idx=3;gate=1;state='ready';steerC=0;clock=0;dist=0;acc=0;gy=a.y;
$('ov').style.display='flex';$('ov').innerHTML='<h1>DIRT RALLY</h1><p>Hit the gas to start · 20 gates, beat the clock</p><p style="font-size:15px;color:#cbd2e0">↑ gas · ↓ brake · ← → steer · Space handbrake (drift) · R restart</p>'}
$('ov').onclick=()=>state=='done'&&reset();
function update(dt){
let up=K.ArrowUp||K.KeyW,dn=K.ArrowDown||K.KeyS,hb=K.Space,st=((K.ArrowRight||K.KeyD)?1:0)-((K.ArrowLeft||K.KeyA)?1:0);
if(state=='done')up=dn=hb=st=0;
if(state=='ready'&&up){state='run';$('ov').style.display='none'}
if(state=='run')clock+=dt;
const fx=Math.sin(psi),fz=Math.cos(psi),rx=-Math.cos(psi),rz=Math.sin(psi),sp=Math.hypot(vx,vz);
let vf=vx*fx+vz*fz,vl=vx*rx+vz*rz;
const a0=P[idx],off0=(px-a0.x)*Math.cos(a0.h)-(pz-a0.z)*Math.sin(a0.h),grass=Math.abs(off0)>RW+.5;
if(up)vf+=24*(1-Math.max(0,vf)/64)*dt;
if(dn)vf+=(vf>1?-40:-14)*dt;
vf=Math.max(vf,-12);vf-=vf*(grass?.7:.07)*dt;
if(hb)vf-=vf*.45*dt;
vl*=Math.exp(-(hb?1.1:8-Math.min(4,sp*.05))*dt);
steerC+=(st-steerC)*Math.min(1,dt*8);
psi-=steerC*1.7/(1+sp/40)*(hb?1.7:1)*Math.min(1,sp/6)*dt*(vf<-.5?-1:1);
vx=fx*vf+rx*vl;vz=fz*vf+rz*vl;px+=vx*dt;pz+=vz*dt;
// locate on track
let best2=1e9,bi=idx;for(let i=Math.max(0,idx-6);i<Math.min(N-2,idx+25);i++){const dx=px-P[i].x,dz=pz-P[i].z,d=dx*dx+dz*dz;if(d<best2){best2=d;bi=i}}idx=bi;
const a=P[idx],b=P[idx+1],off=(px-a.x)*Math.cos(a.h)-(pz-a.z)*Math.sin(a.h),lim=36;
if(Math.abs(off)>lim){const e=off-Math.sign(off)*lim;px-=Math.cos(a.h)*e;pz+=Math.sin(a.h)*e;vx*=.9;vz*=.9}
const t=Math.max(0,Math.min(1,((px-a.x)*(b.x-a.x)+(pz-a.z)*(b.z-a.z))/(STEP*STEP)));
gy=a.y+(b.y-a.y)*t;const slope=(b.y-a.y)/STEP,spd=Math.hypot(vx,vz);
if(state=='run'&&gate<=20&&idx>=gate*GS){const l='GATE '+gate+'  '+fmt(clock);gate++;spT=2.5;$('split').textContent=l;
if(gate>20){state='done';best=best==null?clock:Math.min(best,clock);$('ov').style.display='flex';
$('ov').innerHTML='<h1>FINISH</h1><p>Time '+fmt(clock)+'</p><p>Best '+fmt(best)+'</p><p style="font-size:15px">Tap or press R to restart</p>'}}
// visuals
car.position.set(px,gy+.05,pz);car.rotation.set(-Math.atan(slope),psi,-steerC*.04*Math.min(1,spd/30));
tail.color.setHex(dn?0xff2222:0x661111);
dist+=spd*dt;acc+=spd*dt;
if(acc>1&&spd>3){acc=0;const d=new T.Object3D();d.rotation.order='YXZ';const ang=Math.atan2(vx,vz);
for(const s of[-.8,.8]){d.position.set(px-Math.sin(psi)*1.4-Math.cos(psi)*s,gy+.05,pz-Math.cos(psi)*1.4+Math.sin(psi)*s);d.rotation.set(-Math.PI/2,ang,0);d.updateMatrix();marks.setMatrixAt(mi++%MK,d.matrix)}
marks.instanceMatrix.needsUpdate=true}
let dd=psi-camA;dd=Math.atan2(Math.sin(dd),Math.cos(dd));camA+=dd*Math.min(1,dt*5);
cam.position.set(px-Math.sin(camA)*8.5,gy+3.7,pz-Math.cos(camA)*8.5);
cam.lookAt(px+Math.sin(camA)*7,gy+1.4,pz+Math.cos(camA)*7);
cam.fov=64+spd*.22;cam.updateProjectionMatrix();
sky.position.copy(cam.position);sunB.position.set(cam.position.x+150,cam.position.y+330,cam.position.z+650);
// HUD
const mph=spd*2.237,tops=[30,55,80,105,130,170];let g=tops.findIndex(v=>mph<v);if(g<0)g=5;
if(g+1!=gear){gear=g+1;clT=.18}clT-=dt;spT-=dt;
const lo=g?tops[g-1]:0;$('rpm').style.setProperty('--p',(.3+.7*Math.min(1,(mph-lo)/(tops[g]-lo))).toFixed(2));
$('gr').textContent=gear;$('sp').textContent=Math.round(mph);$('tm').textContent=fmt(clock);$('gt').textContent='GATE '+Math.min(gate,20)+' OF 20';
$('mi').firstChild.nodeValue=(dist/1609).toFixed(2)+' ';
$('bs').style.setProperty('--v',(50+steerC*50)+'%');$('bt').style.setProperty('--v',up?'100%':'0%');$('bb').style.setProperty('--v',dn?'100%':'0%');
$('thb').classList.toggle('on',!!hb);$('tcl').classList.toggle('on',clT>0||!!K.ShiftLeft);
$('split').style.display=spT>0?'block':'none';
// pace note
const c=$('pace').getContext('2d'),s=Math.sin(a.h),co=Math.cos(a.h);c.clearRect(0,0,72,44);c.lineWidth=2.5;c.lineCap='round';
const L=p=>[36+(-(p.x-a.x)*co+(p.z-a.z)*s)*.4,40-((p.x-a.x)*s+(p.z-a.z)*co)*.12];
for(let k=0;k<80&&idx+k+2<N;k+=2){const p=L(P[idx+k]),q=L(P[idx+k+2]);c.strokeStyle=k<8?'#ff7a1a':'#e8edf5';c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.stroke()}
}
reset();let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);R.render(scene,cam)})(last);
</script></body></html>
